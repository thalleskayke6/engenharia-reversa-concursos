<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Engenharia reversa da banca — método de estudo por questões">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0a09"/>
      <stop offset="55%" stop-color="#121110"/>
      <stop offset="100%" stop-color="#0b0a09"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f5c518"/>
      <stop offset="100%" stop-color="#e0a800"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f5c518" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#f5c518" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>

  <!-- chevrons decorativos, canto esquerdo -->
  <g stroke="#8a6a00" stroke-width="2" fill="none" opacity="0.55">
    <path d="M40 250 L96 150 L152 250"/>
    <path d="M74 250 L112 182 L150 250"/>
    <path d="M120 90 L152 34 L184 90"/>
  </g>

  <!-- linhas diagonais, canto direito -->
  <g stroke="#7a5f00" stroke-width="2" opacity="0.5">
    <path d="M980 320 L1120 40"/>
    <path d="M1016 320 L1156 40"/>
    <path d="M1052 320 L1192 40"/>
    <path d="M1088 320 L1228 40"/>
  </g>
  <path d="M1180 320 L1280 320 L1280 150 Z" fill="#c99a00" opacity="0.35"/>

  <!-- selo: engrenagem dentro de cabeça -->
  <g transform="translate(640,74)">
    <path d="M0 -46 L40 -30 L40 16 Q40 42 0 56 Q-40 42 -40 16 L-40 -30 Z"
          fill="none" stroke="url(#gold)" stroke-width="3"/>
    <g fill="none" stroke="url(#gold)" stroke-width="2.6">
      <circle cx="0" cy="4" r="13"/>
      <circle cx="0" cy="4" r="5"/>
      <g stroke-linecap="round">
        <path d="M0 -16 L0 -22"/><path d="M0 24 L0 30"/>
        <path d="M-20 4 L-26 4"/><path d="M20 4 L26 4"/>
        <path d="M-14 -10 L-19 -15"/><path d="M14 18 L19 23"/>
        <path d="M14 -10 L19 -15"/><path d="M-14 18 L-19 23"/>
      </g>
    </g>
  </g>

  <text x="640" y="188" text-anchor="middle"
        font-family="Impact, 'Arial Black', 'Segoe UI', sans-serif"
        font-size="58" letter-spacing="1.5" fill="url(#gold)">ENGENHARIA REVERSA DA BANCA</text>

  <text x="640" y="228" text-anchor="middle"
        font-family="'Segoe UI', Arial, sans-serif" font-size="20"
        letter-spacing="5.5" fill="#e9e2d4">ESTUDO POR QUESTÕES</text>

  <line x1="360" y1="252" x2="920" y2="252" stroke="url(#fade)" stroke-width="1.5"/>
  <line x1="920" y1="252" x2="360" y2="252" stroke="url(#fade)" stroke-width="1.5"/>

  <text x="640" y="284" text-anchor="middle"
        font-family="'Segoe UI', Arial, sans-serif" font-size="16"
        letter-spacing="1.2" fill="#a89c86">método de Valter Rodrigues · sistematização independente</text>
</svg>
